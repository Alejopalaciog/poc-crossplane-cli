apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xapigatewayintegrations.aws.platform.nequi.com
spec:
  defaultCompositeDeletePolicy: Background
  defaultCompositionUpdatePolicy: Automatic
  group: aws.platform.nequi.com
  names:
    kind: XAPIGatewayIntegration
    plural: xapigatewayintegrations
  scope: Cluster
  versions:
  - name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              parameters:
                properties:
                  apiId:
                    description: "Id del API Gateway REST API al que se asociar\xC3\
                      \xA1n los m\xC3\xA9todos e integraciones. Debe existir previamente.\n"
                    type: string
                  apiResources:
                    additionalProperties:
                      properties:
                        apiKeyRequired:
                          description: 'Si requiere API Key. Este valor es obligatorio
                            debido a controles de seguridad.

                            '
                          type: boolean
                        arnCredentials:
                          description: 'ARN del rol IAM que API Gateway asume para
                            invocar el backend. Requerido para integraciones AWS (SQS,
                            Step Functions, etc.)

                            '
                          type: string
                        authorization:
                          default: NONE
                          description: "Tipo de autorizaci\xC3\xB3n para el m\xC3\xA9\
                            todo."
                          enum:
                          - NONE
                          - COGNITO_USER_POOLS
                          - CUSTOM
                          - AWS_IAM
                          type: string
                        authorizationScopes:
                          default: []
                          description: "Scopes de autorizaci\xC3\xB3n (solo para COGNITO_USER_POOLS)."
                          items:
                            type: string
                          type: array
                        connectionType:
                          default: INTERNET
                          description: "Tipo de conexi\xC3\xB3n. INTERNET para Lambda/SQS\
                            \ directos, VPC_LINK para integraciones a trav\xC3\xA9\
                            s de VPC Link.\n"
                          enum:
                          - INTERNET
                          - VPC_LINK
                          type: string
                        httpMethod:
                          description: "M\xC3\xA9todo HTTP del endpoint."
                          enum:
                          - POST
                          - GET
                          - PUT
                          - PATCH
                          - DELETE
                          - OPTIONS
                          - ANY
                          type: string
                        integrationHttpMethod:
                          description: "M\xC3\xA9todo HTTP usado en la integraci\xC3\
                            \xB3n con el backend. Para Lambda con autorizaci\xC3\xB3\
                            n usar POST.\n"
                          enum:
                          - POST
                          - GET
                          - PUT
                          - PATCH
                          - DELETE
                          - OPTIONS
                          - ANY
                          type: string
                        integrationRequestParameters:
                          additionalProperties:
                            type: string
                          default: {}
                          description: "Par\xC3\xA1metros de request de la integraci\xC3\
                            \xB3n. Los headers de seguridad se agregan autom\xC3\xA1\
                            ticamente.\n"
                          type: object
                        integrationResponseParameters:
                          additionalProperties:
                            type: string
                          default: {}
                          description: "Par\xC3\xA1metros de la respuesta de la integraci\xC3\
                            \xB3n. Los headers de seguridad se agregan autom\xC3\xA1\
                            ticamente.\n"
                          type: object
                        integrationResponseTemplates:
                          additionalProperties:
                            type: string
                          default: {}
                          description: "Templates de mapping para la respuesta de\
                            \ la integraci\xC3\xB3n. Clave: content-type, valor: template.\n"
                          type: object
                        integrationResponsesErrors:
                          additionalProperties:
                            properties:
                              responseParametersErrors:
                                additionalProperties:
                                  type: string
                                default: {}
                                description: "Par\xC3\xA1metros de la respuesta de\
                                  \ error."
                                type: object
                              responseTemplatesErrors:
                                additionalProperties:
                                  type: string
                                default: {}
                                description: Templates de la respuesta de error.
                                type: object
                              selectionPatternErrors:
                                description: "Patr\xC3\xB3n regex de selecci\xC3\xB3\
                                  n para este error."
                                type: string
                              statusCodeErrors:
                                description: "C\xC3\xB3digo de estado HTTP para el\
                                  \ error."
                                type: string
                            required:
                            - statusCodeErrors
                            type: object
                          default: {}
                          description: "Respuestas de integraci\xC3\xB3n adicionales\
                            \ para manejo de errores. Cada clave es un identificador\
                            \ del error.\n"
                          type: object
                        integrationTarget:
                          description: "ARN del ALB target para VPC Link v2 (override\
                            \ por m\xC3\xA9todo). Si no se proporciona, se usa el\
                            \ integrationTarget del nivel superior.\n"
                          type: string
                        integrationType:
                          description: "Tipo de integraci\xC3\xB3n. HTTP/HTTP_PROXY\
                            \ para VPC Link, AWS/AWS_PROXY para Lambda/SQS.\n"
                          enum:
                          - HTTP
                          - HTTP_PROXY
                          - AWS
                          - AWS_PROXY
                          - MOCK
                          type: string
                        integrationUri:
                          description: "URI de la integraci\xC3\xB3n. Para Lambda\
                            \ use el ARN de invocaci\xC3\xB3n. Para VPC Link use la\
                            \ URL del backend.\n"
                          type: string
                        methodRequestParameters:
                          additionalProperties:
                            type: string
                          default: {}
                          description: "Par\xC3\xA1metros de request del m\xC3\xA9\
                            todo. Clave: nombre del par\xC3\xA1metro, valor: \"true\"\
                            /\"false\" indicando si es requerido.\n"
                          type: object
                        methodResponseParameters:
                          additionalProperties:
                            type: string
                          default: {}
                          description: "Par\xC3\xA1metros de la respuesta del m\xC3\
                            \xA9todo. Los headers de seguridad (Strict-Transport-Security,\
                            \ X-Content-Type-Options) se agregan autom\xC3\xA1ticamente.\n"
                          type: object
                        methodResponsesErrors:
                          additionalProperties:
                            properties:
                              responseModelsErrors:
                                additionalProperties:
                                  type: string
                                default: {}
                                description: "Modelos de la respuesta de error del\
                                  \ m\xC3\xA9todo."
                                type: object
                              responseParametersErrors:
                                additionalProperties:
                                  type: string
                                default: {}
                                description: "Par\xC3\xA1metros de la respuesta de\
                                  \ error del m\xC3\xA9todo."
                                type: object
                              statusCodeErrors:
                                description: "C\xC3\xB3digo de estado HTTP para el\
                                  \ error."
                                type: string
                            required:
                            - statusCodeErrors
                            type: object
                          default: {}
                          description: "Respuestas de m\xC3\xA9todo adicionales para\
                            \ manejo de errores. Cada clave es un identificador del\
                            \ error.\n"
                          type: object
                        passthroughBehavior:
                          description: 'Comportamiento de passthrough para content
                            types no mapeados.

                            '
                          enum:
                          - WHEN_NO_MATCH
                          - WHEN_NO_TEMPLATES
                          - NEVER
                          type: string
                        requestTemplates:
                          additionalProperties:
                            type: string
                          default: {}
                          description: "Templates de mapping para el request de la\
                            \ integraci\xC3\xB3n. Clave: content-type, valor: template.\n"
                          type: object
                        resourceId:
                          description: "ID del API Gateway Resource donde se crear\xC3\
                            \xA1 el m\xC3\xA9todo. Use un ID directo o @nombreDelPath\
                            \ para referenciar un path de pathResources.\n"
                          type: string
                        responseModels:
                          additionalProperties:
                            type: string
                          default: {}
                          description: "Modelos de la respuesta del m\xC3\xA9todo.\
                            \ Clave: content-type, valor: nombre del modelo.\n"
                          type: object
                        selectionPattern:
                          description: "Patr\xC3\xB3n regex para seleccionar esta\
                            \ integration response. Ejemplo: \"2\\\\d{2}\" para c\xC3\
                            \xB3digos 2xx.\n"
                          type: string
                        statusCode:
                          description: "C\xC3\xB3digo de estado HTTP principal para\
                            \ la respuesta del m\xC3\xA9todo.\n"
                          type: integer
                        timeoutMilliseconds:
                          default: 29000
                          description: "Timeout de la integraci\xC3\xB3n en milisegundos."
                          type: integer
                      required:
                      - resourceId
                      - httpMethod
                      - apiKeyRequired
                      - integrationUri
                      - integrationType
                      - integrationHttpMethod
                      - statusCode
                      type: object
                    description: "Mapa de configuraciones para crear m\xC3\xA9todos\
                      \ e integraciones en el API Gateway. Cada clave del mapa identifica\
                      \ un m\xC3\xA9todo y su integraci\xC3\xB3n asociada. Use la\
                      \ notaci\xC3\xB3n @nombreDelPath en resourceId para referenciar\
                      \ un path creado en pathResources de este mismo claim.\n"
                    type: object
                  authorizerId:
                    description: 'Id del autorizador de Cognito o Lambda Auth. Requerido
                      cuando authorization es COGNITO_USER_POOLS o CUSTOM.

                      '
                    type: string
                  env:
                    description: "Ambiente de despliegue (dev, qa, stg, pdn). Se usa\
                      \ para resolver din\xC3\xA1micamente el nombre del VPC Link\
                      \ V2 cuando no se pasa vpcLinkId expl\xC3\xADcitamente.\n"
                    enum:
                    - dev
                    - qa
                    - stg
                    - pdn
                    - sbx
                    type: string
                  integrationTarget:
                    description: "ARN del ALB al que se va a llegar con la integraci\xC3\
                      \xB3n mediante VPC Link v2. Requerido por AWS cuando el VPC\
                      \ Link es v2.\n"
                    type: string
                  managementPolicies:
                    description: "Pol\xC3\xADticas de gesti\xC3\xB3n que se propagan\
                      \ a TODOS los managed resources de la API (paths, methods, integrations,\
                      \ responses). Default [\"Observe\"] (solo lectura/adopci\xC3\
                      \xB3n). Para pasar a managed sin borrado usar [\"Observe\",\"\
                      Create\",\"Update\",\"LateInitialize\"]. Nunca \"Delete\" en\
                      \ la 1\xC2\xAA adopci\xC3\xB3n.\n"
                    items:
                      type: string
                    type: array
                  pathResources:
                    additionalProperties:
                      properties:
                        parentId:
                          description: "ID del resource padre. Use un ID directo de\
                            \ un resource existente o la notaci\xC3\xB3n @nombreDelPath\
                            \ para referenciar otro path creado en este mismo claim.\n"
                          type: string
                        pathPart:
                          description: 'El segmento de la URL a crear (ej: "orders",
                            "{orderId}", "items").

                            '
                          type: string
                        resourceId:
                          description: "OPCIONAL. ID real del aws_api_gateway_resource\
                            \ ya existente en AWS (ej: \"n2x389\"). Si se indica,\
                            \ el path se ADOPTA en modo Observe (managementPolicies:\
                            \ [Observe], external-name = este ID) en vez de crearse.\
                            \ \xC3\u0161selo para adoptar paths existentes sin recrearlos.\
                            \ Si se omite, el path se crea normalmente.\n"
                          type: string
                      required:
                      - parentId
                      - pathPart
                      type: object
                    description: "Mapa de paths (aws_api_gateway_resource) a crear.\
                      \ Cada clave es un identificador l\xC3\xB3gico que puede referenciarse\
                      \ desde apiResources usando la notaci\xC3\xB3n @nombre. El parentId\
                      \ puede ser el root resource ID del API o un ID de resource\
                      \ existente. Para referenciar un path creado en este mismo claim,\
                      \ use la notaci\xC3\xB3n @nombreDelPath.\n"
                    type: object
                  providerConfigRef:
                    description: Reference to the AWS provider configuration
                    properties:
                      name:
                        description: Name of the provider configuration
                        type: string
                    required:
                    - name
                    type: object
                  region:
                    default: us-east-1
                    description: AWS region where resources will be created
                    type: string
                  vpcLinkId:
                    description: "Id del VPC Link. Requerido cuando connectionType\
                      \ es VPC_LINK en alguna de las entradas de apiResources. Si\
                      \ no se proporciona, la composici\xC3\xB3n buscar\xC3\xA1 autom\xC3\
                      \xA1ticamente el VPC Link V2 por nombre usando el patr\xC3\xB3\
                      n vpclinkv2-infracloud-ts-centralized-{env}.\n"
                    type: string
                required:
                - apiId
                - apiResources
                - providerConfigRef
                type: object
            required:
            - parameters
            type: object
          status:
            properties:
              atProvider:
                properties:
                  integrationIds:
                    additionalProperties:
                      type: string
                    description: IDs de las integraciones creadas.
                    type: object
                  methodIds:
                    additionalProperties:
                      type: string
                    description: "IDs de los m\xC3\xA9todos creados."
                    type: object
                  resourceIds:
                    additionalProperties:
                      type: string
                    description: IDs de los API Gateway Resources (paths) creados.
                    type: object
                type: object
              resourceLookup:
                description: 'Metadata del lookup de recursos (estado, errores, timestamp).
                  Escrito por function-jarvis-findresources.

                  '
                type: object
                x-kubernetes-preserve-unknown-fields: true
              vpclink:
                description: "Resultado del lookup din\xC3\xA1mico del VPC Link V2\
                  \ realizado por function-jarvis-findresources cuando no se pasa\
                  \ vpcLinkId.\n"
                type: object
                x-kubernetes-preserve-unknown-fields: true
            type: object
        type: object
    served: true

