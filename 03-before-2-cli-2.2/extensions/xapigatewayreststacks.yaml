apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xapigatewayreststacks.aws.platform.nequi.com
spec:
  defaultCompositeDeletePolicy: Background
  defaultCompositionUpdatePolicy: Automatic
  group: aws.platform.nequi.com
  names:
    kind: XAPIGatewayRestStack
    plural: xapigatewayreststacks
  scope: Cluster
  versions:
  - name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              parameters:
                properties:
                  accountId:
                    description: AWS account ID.
                    pattern: ^[0-9]{12}$
                    type: string
                  apiName:
                    description: 'Nombre del REST API en API Gateway. Si no se especifica,
                      se genera como apigw-<capacity>-<country>-<env>.

                      '
                    type: string
                  availability:
                    description: "Clasificaci\xC3\xB3n de la disponibilidad."
                    enum:
                    - critical
                    - moderate
                    - tolerable
                    - low
                    type: string
                  basePath:
                    description: 'Base path para el mapping (ej: ''v1''). Si se omite,
                      se mapea el root (/).

                      '
                    type: string
                  binaryMediaTypes:
                    default: []
                    description: Lista de media types binarios soportados por el API.
                    items:
                      type: string
                    type: array
                  capacity:
                    description: Nombre del proyecto en el que se esta trabajando.
                    type: string
                  confidentiality:
                    description: "Clasificaci\xC3\xB3n de la confidencialidad."
                    enum:
                    - public
                    - internal
                    - confidential
                    - restricted
                    type: string
                  country:
                    description: "Pa\xC3\xADs de despliegue."
                    enum:
                    - co
                    - pa
                    - gt
                    - ts
                    type: string
                  deployment:
                    default: jarvis
                    description: Where the deployment was made
                    enum:
                    - jarvis
                    type: string
                  description:
                    default: REST API managed by Crossplane
                    description: "Descripci\xC3\xB3n del REST API."
                    type: string
                  endpointType:
                    default: REGIONAL
                    description: "Tipo de endpoint del API Gateway. REGIONAL para\
                      \ acceso dentro de la misma regi\xC3\xB3n. PRIVATE para acceso\
                      \ solo desde VPC via VPC Endpoint. EDGE para distribuci\xC3\xB3\
                      n v\xC3\xADa CloudFront.\n"
                    enum:
                    - REGIONAL
                    - PRIVATE
                    - EDGE
                    type: string
                  env:
                    description: "Ambiente donde ser\xC3\xA1 desplegado el componente.\
                      \ Sus \xC3\xBAnicos valores posibles ser\xC3\xA1n: dev, qa,\
                      \ pdn, sbx, stg.\n"
                    enum:
                    - dev
                    - qa
                    - pdn
                    - sbx
                    - stg
                    type: string
                  existingCertificateArn:
                    description: "ARN de un certificado ACM ya emitido (ISSUED). Requerido\
                      \ para crear el DomainName \xE2\u20AC\u201D esta XRD no crea\
                      \ certificados.\n"
                    type: string
                  externalName:
                    description: "Nombre l\xC3\xB3gico/real del REST API cuando standardName\
                      \ es false (usado en metadata.name y forProvider.name).\n"
                    type: string
                  externalNameId:
                    description: 'ID REAL del REST API en API Gateway (ej. "abc123def4").
                      Es el identificador que el managed resource RestAPI usa para
                      encontrarse en AWS (se fija en crossplane.io/external-name).
                      Requerido para adoptar.

                      '
                    type: string
                  hostedZone:
                    description: Zona DNS base (ej. nequi.com.co).
                    type: string
                  integrity:
                    description: "Clasificaci\xC3\xB3n de la integridad."
                    enum:
                    - critical
                    - moderate
                    - tolerable
                    - low
                    type: string
                  managementPolicies:
                    description: "Pol\xC3\xADticas de gesti\xC3\xB3n de Crossplane\
                      \ sobre los managed resources emitidos (RestAPI, RestAPIPolicy,\
                      \ DomainName, BasePathMapping). Acepta Observe, Create, Update,\
                      \ Delete, LateInitialize, *. Uso principal: [\"Observe\"] para\
                      \ adoptar en solo-lectura. Si no se provee, gesti\xC3\xB3n completa\
                      \ (default).\n"
                    items:
                      type: string
                    type: array
                  pci:
                    description: Holds unmasked credit or debit card data
                    type: boolean
                  providerConfigRef:
                    description: Reference to the AWS provider configuration
                    properties:
                      name:
                        description: Name of the provider configuration
                        type: string
                    required:
                    - name
                    type: object
                  region:
                    default: us-east-1
                    description: AWS region where resources will be created
                    type: string
                  resourcePolicy:
                    description: "JSON de la pol\xC3\xADtica de recursos del API Gateway.\
                      \ Si no se provee y endpointType=PRIVATE, se genera autom\xC3\
                      \xA1ticamente.\n"
                    type: string
                  serviceid:
                    description: Identifier of the deployment
                    type: string
                  standardName:
                    default: true
                    description: "true (default): el REST API se nombra apigw-{capacity}-{country}-{env}\
                      \ (o apiName si se pasa). Comportamiento actual, sin cambios.\
                      \ false: ADOPTA un REST API existente. El nombre l\xC3\xB3gico\
                      \ se toma de externalName y el external-name real (el ID del\
                      \ API) se fija con externalNameId.\n"
                    type: boolean
                  subdomain:
                    description: 'Subdominio para el custom domain (ej: ''api-payments'').
                      Junto con hostedZone y existingCertificateArn crea DomainName
                      + BasePathMapping.

                      '
                    type: string
                  tags:
                    additionalProperties:
                      type: string
                    default: {}
                    description: Tags adicionales para aplicar al REST API.
                    type: object
                  vpcEndpointIds:
                    default: []
                    description: 'IDs de VPC Endpoints para API Gateway (solo aplica
                      si endpointType=PRIVATE).

                      '
                    items:
                      type: string
                    type: array
                  vpcLinkId:
                    description: "ID de un VPC Link ya existente, para que las Integrations\
                      \ lo referencien. Esta XRD no crea el VPC Link \xE2\u20AC\u201D\
                      \ solo lo expone en status.atProvider.vpcLinkId.\n"
                    type: string
                required:
                - capacity
                - country
                - env
                - serviceid
                - confidentiality
                - integrity
                - availability
                - pci
                - providerConfigRef
                type: object
            required:
            - parameters
            type: object
          status:
            properties:
              atProvider:
                properties:
                  certificateArn:
                    description: ARN del certificado ACM del custom domain (si fue
                      creado).
                    type: string
                  domainName:
                    description: FQDN del custom domain (subdomain.hostedZone).
                    type: string
                  executionArn:
                    description: "ARN de ejecuci\xC3\xB3n del API (para permisos Lambda)."
                    type: string
                  regionalDomainName:
                    description: Domain name regional de API Gateway (para el registro
                      DNS).
                    type: string
                  regionalHostedZoneId:
                    description: Hosted zone ID del domain regional.
                    type: string
                  restApiId:
                    description: ID del REST API creado en API Gateway.
                    type: string
                  rootResourceId:
                    description: "ID del recurso ra\xC3\xADz (/) del REST API."
                    type: string
                  vpcLinkId:
                    description: ID del VPC Link (si fue provisto).
                    type: string
                type: object
            type: object
        type: object
    served: true

